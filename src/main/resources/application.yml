server:
  port: 8080

spring:
  application:
    name: kinoicon-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kinoicon}
    username: ${DB_USER:kinoicon}
    password: ${DB_PASSWORD:kinoicon}
    driver-class-name: org.postgresql.Driver
  jackson:
    property-naming-strategy: SNAKE_CASE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-min-32-bytes-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  search:
    similarity-threshold: ${SEARCH_SIMILARITY_THRESHOLD:0.1}
    limit: 3
  kp:
    rating-uri: https://rating.kinopoisk.ru/{kpId}.xml

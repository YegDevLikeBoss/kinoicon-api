name: Deploy

on:
  workflow_dispatch:

env:
  SSH_PORT: 3333
  DEPLOY_DIR: /opt/kinoicon

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SSH_PORT }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SSH_PORT }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE,GH_ACTOR,GH_TOKEN,DEPLOY_DIR
          script_stop: true
          script: |
            cd "$DEPLOY_DIR"

            # запоминаем версию образа рядом с секретами
            sed -i '/^APP_IMAGE=/d' .env
            echo "APP_IMAGE=$IMAGE" >> .env

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose pull app
            docker compose up -d
            docker logout ghcr.io

            docker compose ps
            docker image prune -f